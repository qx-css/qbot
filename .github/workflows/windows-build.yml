name: Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build QdBot
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          msbuild QdBot.vcxproj /t:restore /p:RestorePackagesConfig=true /p:Configuration=Release /p:Platform=x64 /fileLogger "/fileLoggerParameters:LogFile=restore.log;Verbosity=normal"

      - name: Build Release
        shell: pwsh
        run: |
          $cppwinrt = Resolve-Path "packages\Microsoft.Windows.CppWinRT.2.0.240405.15\bin\cppwinrt.exe"
          $cppwinrtDir = Split-Path $cppwinrt
          Write-Host "cppwinrt: $cppwinrt"
          msbuild QdBot.sln /p:Configuration=Release /p:Platform=x64 /p:CppWinRTPackage=true /p:CppWinRTPath="$cppwinrtDir\" /m /fileLogger "/fileLoggerParameters:LogFile=build.log;Verbosity=detailed"
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0 -and (Test-Path build.log)) {
            $patterns = 'error |fatal error|MSB[0-9]{4}|C[0-9]{4}'
            Select-String -Path build.log -Pattern $patterns | Select-Object -First 80 | ForEach-Object {
              $line = $_.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error::$line"
            }
          }
          exit $buildExitCode

      - name: Collect build output
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ChildItem -Recurse -Filter QdBot.exe | Copy-Item -Destination artifacts -Force
          Get-ChildItem -Recurse -Include *.dll,*.pri,*.winmd,*.json -File |
            Where-Object { $_.FullName -match "\\x64\\Release\\" } |
            Copy-Item -Destination artifacts -Force -ErrorAction SilentlyContinue

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QdBot-windows-x64
          path: artifacts/
